services:
  postgres:
    image: postgres:16-alpine
    container_name: prod-taxiterminalen-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    networks:
      - prod-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

networks:
  prod-internal-net:
    internal: true

volumes:
  prod_postgres_data:
    name: prod_taxiterminalen_pgdata
