services:
  postgres:
    image: postgres:16-alpine
    container_name: stage-taxiterminalen-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - stage_postgres_data:/var/lib/postgresql/data
    networks:
      - stage-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stage-taxiterminalen-backend
    restart: always
    env_file: .env
    environment:
      PORT: 3500
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stage-internal-net
      - stage-proxy-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CONFIGURATION: staging
    container_name: stage-taxiterminalen-frontend
    restart: always
    networks:
      - stage-proxy-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  nginx-gateway:
    image: nginx:alpine
    container_name: stage-taxiterminalen-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - stage-proxy-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  stage-internal-net:
    internal: true
  stage-proxy-net:
    driver: bridge

volumes:
  stage_postgres_data:
    name: stage_taxiterminalen_pgdata
